[project]
name = "cone-detector-training"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "ultralytics",
    "onnx",
    "onnxslim",
    "onnxruntime",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.uv]
index-url = "https://pypi.org/simple"

# cu118 builds still ship sm_61 kernels, so training works on the Pascal GTX 1050.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
